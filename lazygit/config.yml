gui:
  showBottomLine: false
  showRandomTip: false
  showCommandLog: false
disableStartupPopups: true
git:
  diffRenderers:
    - name: delta
      colorArg: always
      command: 'delta --paging=never --line-numbers --syntax-theme=ansi --plus-style="syntax #1b3326" --minus-style="syntax #3a2228"'
